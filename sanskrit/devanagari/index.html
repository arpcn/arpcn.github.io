<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase 數據表格</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .table-container {
            margin-top: 20px;
        }
        table {
            border-collapse: collapse; /* 合并边框 */
            width: 100%; /* 表格宽度 */
        }
        th {
            border: 1px solid #ddd; /* 边框 */
            padding: 8px; /* 内边距 */
            text-align: center; /* 水平居中 */
            vertical-align: middle; /* 垂直居中 */
            background-color: #f2f2f2; /* 背景色（可选） */
        }
        .tab-content {
            padding: 15px;
            border-left: 1px solid #ddd;
            border-right: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
        }
        table {
            text-align: center;
        }
        th, td {
            vertical-align: middle;
        }
        .table td, .table th {
            text-align: center;
        }

        /* ===== 登錄界面樣式 ===== */
        .login-card {
            margin-top: 100px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            border-radius: 15px;
            border: none;
        }
        .card-header {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
            text-align: center;
        }
        .login-logo {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 600;
        }
        #loginForm {
            padding: 20px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #dee2e6;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #6a11cb;
            box-shadow: 0 0 0 0.25rem rgba(106, 17, 203, 0.25);
        }
        #loginBtn {
            border-radius: 10px;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            border: none;
            transition: all 0.3s;
            margin-top: 10px;
        }
        #loginBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.3);
        }
        #loginBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .form-label {
            font-weight: 500;
            color: #495057;
            margin-bottom: 8px;
        }
        .login-loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 5px;
            display: none;
        }
        .has-error .form-control {
            border-color: #dc3545;
        }
        .has-error .error-message {
            display: block;
        }

        /* 退出按鈕固定 */
        #logoutBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1030;
        }

        /* 加載動畫 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #6a11cb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @media (max-width: 768px) {
            .login-card {
                margin-top: 50px;
            }
        }
    </style>
</head>
<body>

<!-- ========== 登錄界面 ========== -->
<div id="loginContainer" class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card login-card">
                <div class="card-header">
                    <div class="login-logo">ॐ</div>
                    <div class="login-title">登  錄</div>
                </div>
                <div class="card-body">
                    <form id="loginForm">
                        <div class="mb-4">
                            <label for="email" class="form-label">郵箱地址</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="請輸入郵箱" required>
                            <div class="error-message" id="emailError"></div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">密碼</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="請輸入密碼" required>
                            <div class="error-message" id="passwordError"></div>
                        </div>
                        <button type="submit" id="loginBtn" class="btn btn-primary w-100">
                            <span id="loginText">確  認</span>
                            <span id="loginSpinner" style="display: none;">
                                <span class="login-loading"></span>登錄中...
                            </span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ========== 數據界面（默認隱藏） ========== -->
<div id="dataContainer" class="container" style="display: none;">

    <!-- 退出按鈕 -->
    <button id="logoutBtn" class="btn btn-sm btn-outline-secondary position-fixed">
        <i class="bi bi-box-arrow-right me-1"></i>退出
    </button>

    <h1 class="text-center mb-4">Firebase 數據展示</h1>

    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="userStats-tab" data-bs-toggle="tab" data-bs-target="#userStats" type="button" role="tab">用戶統計</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="gameRecords-tab" data-bs-toggle="tab" data-bs-target="#gameRecords" type="button" role="tab">游戲記錄</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="blacklist-tab" data-bs-toggle="tab" data-bs-target="#blacklist" type="button" role="tab">黑名單</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="whitelist-tab" data-bs-toggle="tab" data-bs-target="#whitelist" type="button" role="tab">白名單</button>
        </li>
    </ul>

    <div class="tab-content" id="myTabContent">
        <div class="tab-pane fade show active" id="userStats" role="tabpanel">
            <div class="table-container">
                <h3>用戶統計數據</h3>
                <div class="table-responsive">
                    <table class="table table-striped table-bordered" id="userStatsTable">
                        <thead class="table-dark">
                            <tr>
                                <th rowspan="2">用戶ID</th>
                                <th rowspan="2">游戲次數</th>
                                <th rowspan="2">最近登錄</th>
                                <th colspan="4">最佳時間</th>
                            </tr>
                            <tr>
                                <th>元音</th>
                                <th>輔音</th>
                                <th>數字</th>
                                <th>混合</th>
                            </tr>
                        </thead>
                        <tbody id="userStatsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="gameRecords" role="tabpanel">
            <div class="table-container">
                <h3>游戲記錄數據</h3>
                <div class="mb-3">
                    <label for="userSelect" class="form-label">選擇用戶:</label>
                    <select class="form-select" id="userSelect">
                        <option value="">-- 請選擇用戶 --</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-bordered" id="gameRecordsTable">
                        <thead class="table-dark">
                            <tr>
                                <th>記錄ID</th>
                                <th>游戲模式</th>
                                <th>用時(秒)</th>
                                <th>時間戳</th>
                            </tr>
                        </thead>
                        <tbody id="gameRecordsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="blacklist" role="tabpanel">
            <div class="table-container">
                <h3>黑名單用戶</h3>
                <div class="table-responsive">
                    <table class="table table-striped table-bordered" id="blacklistTable">
                        <thead class="table-dark">
                            <tr>
                                <th>用戶ID</th>
                                <th>原因</th>
                                <th>添加時間</th>
                            </tr>
                        </thead>
                        <tbody id="blacklistBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="whitelist" role="tabpanel">
            <div class="table-container">
                <h3>白名單用戶</h3>
                <div class="table-responsive">
                    <table class="table table-striped table-bordered" id="whitelistTable">
                        <thead class="table-dark">
                            <tr>
                                <th>用戶ID</th>
                                <th>特權級別</th>
                                <th>添加時間</th>
                            </tr>
                        </thead>
                        <tbody id="whitelistBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 加載動畫 -->
<div id="loadingOverlay" class="loading-overlay" style="display: none;">
    <div class="spinner"></div>
</div>

<!-- ===== Firebase SDK（補上 auth） ===== -->
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ===== Firebase 配置 =====
const firebaseConfig = {
    apiKey: "AIzaSyAvxH-5gah6gVufzNFrne-c7VfU6VSpcyQ",
    authDomain: "arbzn09.firebaseapp.com",
    databaseURL: "https://arbzn09-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "arbzn09",
    storageBucket: "arbzn09.firebasestorage.app",
    messagingSenderId: "172952488674",
    appId: "1:172952488674:web:1369dc83ac8df8c6ca6cbb",
    measurementId: "G-WNKZZ26059"
};

// 初始化 Firebase
firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const auth = firebase.auth();

// ===== DOM 元素 =====
const userStatsBody = document.getElementById('userStatsBody');
const gameRecordsBody = document.getElementById('gameRecordsBody');
const blacklistBody = document.getElementById('blacklistBody');
const whitelistBody = document.getElementById('whitelistBody');
const userSelect = document.getElementById('userSelect');

// ===== 工具函數 =====
function showLoading() {
    document.getElementById('loadingOverlay').style.display = 'flex';
}
function hideLoading() {
    document.getElementById('loadingOverlay').style.display = 'none';
}
function showError(field, message) {
    const input = document.getElementById(field);
    const errorElement = document.getElementById(field + 'Error');
    input.classList.add('has-error');
    errorElement.textContent = message;
    errorElement.style.display = 'block';
}
function clearError(field) {
    const input = document.getElementById(field);
    const errorElement = document.getElementById(field + 'Error');
    input.classList.remove('has-error');
    errorElement.style.display = 'none';
}

// ===== 登錄邏輯 =====
let isLoggingIn = false;

function loginUser(email, password) {
    if (isLoggingIn) return;

    if (!email) { showError('email', '請輸入郵箱地址'); return; }
    if (!password) { showError('password', '請輸入密碼'); return; }

    clearError('email');
    clearError('password');

    isLoggingIn = true;
    document.getElementById('loginText').style.display = 'none';
    document.getElementById('loginSpinner').style.display = 'inline';
    document.getElementById('loginBtn').disabled = true;

    auth.signInWithEmailAndPassword(email, password)
        .then(() => {
            console.log('登錄成功');
        })
        .catch((error) => {
            console.error("登錄錯誤:", error);
            let errorMessage = "登錄失敗";
            switch (error.code) {
                case 'auth/invalid-email':
                    errorMessage = "郵箱格式不正確";
                    showError('email', errorMessage);
                    break;
                case 'auth/user-not-found':
                    errorMessage = "用戶不存在";
                    showError('email', errorMessage);
                    break;
                case 'auth/wrong-password':
                    errorMessage = "密碼錯誤";
                    showError('password', errorMessage);
                    break;
                case 'auth/network-request-failed':
                    errorMessage = "網絡連接失敗，請檢查網絡";
                    alert(errorMessage);
                    break;
                default:
                    errorMessage = "登錄失敗: " + error.message;
                    alert(errorMessage);
            }
        })
        .finally(() => {
            isLoggingIn = false;
            document.getElementById('loginText').style.display = 'inline';
            document.getElementById('loginSpinner').style.display = 'none';
            document.getElementById('loginBtn').disabled = false;
        });
}

// 表單提交
document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    loginUser(
        document.getElementById('email').value,
        document.getElementById('password').value
    );
});

// 輸入框即時驗證
document.getElementById('email').addEventListener('input', function () {
    clearError('email');
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (this.value && !emailRegex.test(this.value)) {
        showError('email', '請輸入有效的郵箱地址');
    }
});
document.getElementById('password').addEventListener('input', function () {
    clearError('password');
});

// 回車登錄
document.getElementById('password').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        loginUser(
            document.getElementById('email').value,
            document.getElementById('password').value
        );
    }
});

// ===== 認證狀態監聽 =====
let dataLoaded = false; // 避免重複加載監聽

auth.onAuthStateChanged((user) => {
    const loginContainer = document.getElementById('loginContainer');
    const dataContainer = document.getElementById('dataContainer');

    if (user) {
        console.log('用戶已登錄:', user.email);
        loginContainer.style.display = 'none';
        dataContainer.style.display = 'block';

        if (!dataLoaded) {
            dataLoaded = true;
            loadUserStats();
            loadGameRecords();
            loadBlacklist();
            loadWhitelist();
        }
    } else {
        console.log('用戶未登錄');
        loginContainer.style.display = 'block';
        dataContainer.style.display = 'none';
        dataLoaded = false;
    }
});

// ===== 退出登錄 =====
document.getElementById('logoutBtn').addEventListener('click', () => {
    if (confirm('確定要退出登錄嗎？')) {
        showLoading();
        auth.signOut().then(() => {
            setTimeout(() => {
                alert('您已安全退出');
                location.reload();
            }, 300);
        }).catch((error) => {
            console.error('退出登錄失敗:', error);
            hideLoading();
            alert('退出失敗: ' + error.message);
        });
    }
});

// ===== 數據加載函數（保持原樣） =====
function loadUserStats() {
    const userStatsRef = database.ref('userStats');
    userStatsRef.on('value', (snapshot) => {
        userStatsBody.innerHTML = '';
        const data = snapshot.val();
        if (!data) {
            userStatsBody.innerHTML = '<tr><td colspan="7" class="text-center">暫無數據</td></tr>';
            return;
        }
        userSelect.innerHTML = '<option value="">-- 請選擇用戶 --</option>';
        Object.keys(data).forEach(uid => {
            const user = data[uid];
            const modes = user.modes || {};

            const getLastPlayed = () => {
                let latestTimestamp = 0;
                Object.keys(modes).forEach(mode => {
                    if (modes[mode]?.lastPlayed && modes[mode].lastPlayed > latestTimestamp) {
                        latestTimestamp = modes[mode].lastPlayed;
                    }
                });
                return latestTimestamp > 0 ? new Date(latestTimestamp).toLocaleString() : '從未遊戲';
            };

            const getBestTime = (modeKeys) => {
                for (const key of modeKeys) {
                    if (modes[key]?.bestTime) {
                        return modes[key].bestTime;
                    }
                }
                return 'N/A';
            };

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${uid}</td>
                <td>${user.gameCount || 0}</td>
                <td>${getLastPlayed()}</td>
                <td>${getBestTime(['vowels', '元音'])}</td>
                <td>${getBestTime(['consonants', '輔音'])}</td>
                <td>${getBestTime(['numbers', '數字'])}</td>
                <td>${getBestTime(['mixed', '混合'])}</td>
            `;
            userStatsBody.appendChild(row);

            const option = document.createElement('option');
            option.value = uid;
            option.textContent = `${user.username} (${uid})`;
            userSelect.appendChild(option);
        });
    });
}

function loadGameRecords() {
    userSelect.addEventListener('change', (e) => {
        const uid = e.target.value;
        gameRecordsBody.innerHTML = '';
        if (!uid) return;
        const gameRecordsRef = database.ref(`gameRecords/${uid}`);
        gameRecordsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                gameRecordsBody.innerHTML = '<tr><td colspan="4" class="text-center">該用戶暫無游戲記錄</td></tr>';
                return;
            }
            Object.keys(data).forEach(mode => {
                const records = data[mode];
                Object.keys(records).forEach(recordId => {
                    const record = records[recordId];
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${recordId}</td>
                        <td>${mode}</td>
                        <td>${record.time}</td>
                        <td>${new Date(record.timestamp).toLocaleString()}</td>
                    `;
                    gameRecordsBody.appendChild(row);
                });
            });
        });
    });
}

function loadBlacklist() {
    const blacklistRef = database.ref('blacklistedUsers');
    blacklistRef.on('value', (snapshot) => {
        blacklistBody.innerHTML = '';
        const data = snapshot.val();
        if (!data) {
            blacklistBody.innerHTML = '<tr><td colspan="3" class="text-center">黑名單為空</td></tr>';
            return;
        }
        Object.keys(data).forEach(uid => {
            const user = data[uid];
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${uid}</td>
                <td>${user.reason || '未指定原因'}</td>
                <td>${new Date(user.timestamp || Date.now()).toLocaleString()}</td>
            `;
            blacklistBody.appendChild(row);
        });
    });
}

function loadWhitelist() {
    const whitelistRef = database.ref('whitelistedUsers');
    whitelistRef.on('value', (snapshot) => {
        whitelistBody.innerHTML = '';
        const data = snapshot.val();
        if (!data) {
            whitelistBody.innerHTML = '<tr><td colspan="3" class="text-center">白名單為空</td></tr>';
            return;
        }
        Object.keys(data).forEach(uid => {
            const user = data[uid];
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${uid}</td>
                <td>${user.level || '普通特權'}</td>
                <td>${new Date(user.timestamp || Date.now()).toLocaleString()}</td>
            `;
            whitelistBody.appendChild(row);
        });
    });
}
</script>
</body>
</html>
